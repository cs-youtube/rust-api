name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    # This repository is public: code from a pull request never runs on the lab's machine.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "lab"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: docker build --target test -t "${{ github.event.repository.name }}:test-${{ github.sha }}" .
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, linux, lab]
    # One deploy at a time, so two pushes cannot pin their digests out of order.
    concurrency: deploy-${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The runner lives on the lab machine, so its architecture is the cluster's.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      # Argo CD deploys what is pinned in the Deployment repository, so this commit is the deployment.
      - uses: actions/checkout@v4
        with:
          repository: cs-youtube/api-lab-deployment
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          path: deployment
      - name: Pin the digest in the Deployment repository
        working-directory: deployment
        run: |
          service="${{ github.event.repository.name }}"
          sed -i 's|^  digest: .*|  digest: ${{ steps.build.outputs.digest }}|' "apps/service/values-$service.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy $service ${GITHUB_SHA::12}"
          git pull --rebase
          git push
